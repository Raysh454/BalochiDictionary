name: balochi_dictionary
description: "Balochi Dictionary — offline Balochi/Latin/English dictionary with a Word of the Day."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # SQLite access. The dictionary ships as a read-only SQLite asset that is
  # copied to app storage on first launch (same approach as the Wails app).
  sqflite: ^2.4.2
  # Desktop (Windows/Linux/macOS) SQLite backend, used for development runs.
  sqflite_common_ffi: ^2.3.6
  path: ^1.9.1
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/db/balochi_dict.db
